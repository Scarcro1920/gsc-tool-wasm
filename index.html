<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IW8 GSC Studio</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; padding:28px; background:#0d111b; color:#e8edf7; font:15px/1.5 system-ui,Arial,sans-serif; }
main { max-width:900px; margin:auto; }
.panel { background:#171e2c; border:1px solid #2b3548; border-radius:14px; padding:22px; margin:16px 0; }
h1 { margin:0 0 4px; font-size:28px; }
.muted { color:#9aa8bd; }
label { display:block; margin:13px 0 6px; font-weight:600; }
select,input[type=file],button { width:100%; padding:12px; border-radius:8px; border:1px solid #39465e; background:#101725; color:#e8edf7; }
button { cursor:pointer; background:#2868d7; border:0; font-weight:700; }
button:disabled { opacity:.5; cursor:wait; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
#status { padding:10px 12px; border-radius:8px; background:#101725; }
#log { min-height:150px; max-height:340px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; background:#080c13; border:1px solid #273247; padding:13px; border-radius:8px; color:#b8c8df; }
#download { display:none; margin-top:12px; text-align:center; text-decoration:none; background:#16794b; color:white; padding:12px; border-radius:8px; font-weight:700; }
.language-row { display:flex; align-items:center; justify-content:flex-end; gap:10px; margin-bottom:12px; }
.language-row label { margin:0; white-space:nowrap; }
.language-row select { width:auto; min-width:150px; }
@media(max-width:650px) { body{padding:14px} .grid{grid-template-columns:1fr} .language-row{justify-content:stretch} .language-row select{flex:1} }
</style>
</head>
<body>
<main>
<div class="language-row">
  <label for="language" data-i18n="languageLabel">Langue</label>
  <select id="language" aria-label="Language">
    <option value="fr">Français</option>
    <option value="en">English</option>
    <option value="ru">Русский</option>
  </select>
</div>

<section class="panel">
<h1>IW8 GSC Studio</h1>
<div class="muted" data-i18n="subtitle">GSC Tool · WebAssembly · Traitement local dans le navigateur</div>
<p id="status">Chargement du moteur WebAssembly...</p>
</section>

<section class="panel">
<div class="grid">
<div>
<label for="mode" data-i18n="operation">Opération</label>
<select id="mode">
<option value="decomp" data-i18n="decomp">Décompiler (.gscbin → .gsc)</option>
<option value="comp" data-i18n="comp">Compiler (.gsc → .gscbin)</option>
<option value="disasm" data-i18n="disasm">Désassembler (.gscbin → .gscasm)</option>
<option value="asm" data-i18n="asm">Assembler (.gscasm → .gscbin)</option>
<option value="parse" data-i18n="parse">Analyser (.gsc)</option>
</select>
</div>
<div>
<label for="system" data-i18n="system">Système IW8</label>
<select id="system">
<option value="pc">PC</option>
<option value="ps4">PlayStation 4</option>
<option value="ps5">PlayStation 5</option>
<option value="xb3">Xbox One</option>
<option value="xb4">Xbox Series X|S</option>
</select>
</div>
</div>
<label for="file" data-i18n="sourceFile">Fichier source</label>
<input id="file" type="file" accept=".gscbin,.gsc,.gscasm,.txt,*/*">
<p class="muted" data-i18n="localNote">Le fichier est traité localement dans le système de fichiers virtuel du moteur.</p>
<button id="run" disabled data-i18n="run">Lancer le moteur</button>
<a id="download" download></a>
</section>

<section class="panel">
<strong data-i18n="console">Console</strong>
<pre id="log">Initialisation...</pre>
</section>
</main>

<script type="module">
import createGscTool from "./gsc-tool.js";

const translations = {
  fr: {
    languageLabel:"Langue",
    subtitle:"GSC Tool · WebAssembly · Traitement local dans le navigateur",
    loading:"Chargement du moteur WebAssembly...",
    operation:"Opération",
    decomp:"Décompiler (.gscbin → .gsc)",
    comp:"Compiler (.gsc → .gscbin)",
    disasm:"Désassembler (.gscbin → .gscasm)",
    asm:"Assembler (.gscasm → .gscbin)",
    parse:"Analyser (.gsc)",
    system:"Système IW8",
    sourceFile:"Fichier source",
    localNote:"Le fichier est traité localement dans le système de fichiers virtuel du moteur.",
    run:"Lancer le moteur",
    console:"Console",
    initializing:"Initialisation...",
    engineFiles:"Chargement de gsc-tool.js et gsc-tool.wasm...",
    engineReady:"Moteur chargé. Choisis un fichier et une opération.",
    engineReadyLog:"Moteur prêt. FS et callMain sont accessibles.",
    engineFailed:"Échec du chargement du moteur.",
    missingExports:"Le moteur ne fournit pas FS ou callMain. Vérifie les exports Emscripten.",
    chooseFile:"Choisis d'abord un fichier.",
    processing:"Traitement en cours...",
    imported:"Fichier importé : ",
    command:"Commande : ",
    returnCode:"Code de retour : ",
    noOutput:"Aucun fichier de sortie détecté. Fichiers trouvés :",
    finishedNoResult:"Commande terminée, mais aucun résultat détecté.",
    download:"Télécharger ",
    result:"Résultat : ",
    size:"Taille : ",
    done:"Opération terminée. Ton fichier est prêt.",
    processingError:"Erreur pendant le traitement.",
    error:"[ERREUR] "
  },
  en: {
    languageLabel:"Language",
    subtitle:"GSC Tool · WebAssembly · Local processing in your browser",
    loading:"Loading WebAssembly engine...",
    operation:"Operation",
    decomp:"Decompile (.gscbin → .gsc)",
    comp:"Compile (.gsc → .gscbin)",
    disasm:"Disassemble (.gscbin → .gscasm)",
    asm:"Assemble (.gscasm → .gscbin)",
    parse:"Parse (.gsc)",
    system:"IW8 platform",
    sourceFile:"Source file",
    localNote:"The file is processed locally in the engine's virtual file system.",
    run:"Run engine",
    console:"Console",
    initializing:"Initializing...",
    engineFiles:"Loading gsc-tool.js and gsc-tool.wasm...",
    engineReady:"Engine loaded. Choose a file and an operation.",
    engineReadyLog:"Engine ready. FS and callMain are available.",
    engineFailed:"Failed to load the engine.",
    missingExports:"The engine does not provide FS or callMain. Check the Emscripten exports.",
    chooseFile:"Choose a file first.",
    processing:"Processing...",
    imported:"File imported: ",
    command:"Command: ",
    returnCode:"Exit code: ",
    noOutput:"No output file detected. Files found:",
    finishedNoResult:"Command finished, but no output was detected.",
    download:"Download ",
    result:"Output: ",
    size:"Size: ",
    done:"Operation completed. Your file is ready.",
    processingError:"An error occurred during processing.",
    error:"[ERROR] "
  },
  ru: {
    languageLabel:"Язык",
    subtitle:"GSC Tool · WebAssembly · Локальная обработка в браузере",
    loading:"Загрузка движка WebAssembly...",
    operation:"Операция",
    decomp:"Декомпиляция (.gscbin → .gsc)",
    comp:"Компиляция (.gsc → .gscbin)",
    disasm:"Дизассемблирование (.gscbin → .gscasm)",
    asm:"Ассемблирование (.gscasm → .gscbin)",
    parse:"Анализ (.gsc)",
    system:"Платформа IW8",
    sourceFile:"Исходный файл",
    localNote:"Файл обрабатывается локально в виртуальной файловой системе движка.",
    run:"Запустить движок",
    console:"Консоль",
    initializing:"Инициализация...",
    engineFiles:"Загрузка gsc-tool.js и gsc-tool.wasm...",
    engineReady:"Движок загружен. Выберите файл и операцию.",
    engineReadyLog:"Движок готов. FS и callMain доступны.",
    engineFailed:"Не удалось загрузить движок.",
    missingExports:"Движок не предоставляет FS или callMain. Проверьте экспорты Emscripten.",
    chooseFile:"Сначала выберите файл.",
    processing:"Обработка...",
    imported:"Файл импортирован: ",
    command:"Команда: ",
    returnCode:"Код возврата: ",
    noOutput:"Выходной файл не найден. Найденные файлы:",
    finishedNoResult:"Команда завершена, но результат не обнаружен.",
    download:"Скачать ",
    result:"Результат: ",
    size:"Размер: ",
    done:"Операция завершена. Файл готов.",
    processingError:"Ошибка во время обработки.",
    error:"[ОШИБКА] "
  }
};

const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const runBtn = document.getElementById("run");
const fileInput = document.getElementById("file");
const downloadEl = document.getElementById("download");
const languageSelect = document.getElementById("language");

let currentLanguage = "fr";
let GSC = null;
let jobNumber = 0;
let currentStatusKey = "loading";
let statusIsGood = false;

function t(key) {
  return translations[currentLanguage][key] ?? translations.en[key] ?? key;
}
function setLanguage(language) {
  currentLanguage = translations[language] ? language : "fr";
  document.documentElement.lang = currentLanguage;
  document.querySelectorAll("[data-i18n]").forEach(element => {
    const key = element.dataset.i18n;
    element.textContent = t(key);
  });
  statusEl.textContent = t(currentStatusKey);
  statusEl.style.color = statusIsGood ? "#67e5a2" : "#ffca75";
  if (downloadEl.style.display === "block" && downloadEl.download) {
    downloadEl.textContent = t("download") + downloadEl.download;
  }
}
function log(message) {
  logEl.textContent += String(message) + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}
function setStatus(key, good = false) {
  currentStatusKey = key;
  statusIsGood = good;
  statusEl.textContent = t(key);
  statusEl.style.color = good ? "#67e5a2" : "#ffca75";
}
function safeName(name) {
  return name.replace(/[^a-zA-Z0-9._-]/g, "_").replace(/^\.+/, "") || "input";
}
function makeDir(FS, path) {
  try { FS.mkdir(path); }
  catch (e) { if (!FS.analyzePath(path).exists) throw e; }
}
function walkFiles(FS, root) {
  const found = [];
  function walk(dir) {
    let entries;
    try { entries = FS.readdir(dir); } catch { return; }
    for (const entry of entries) {
      if (entry === "." || entry === "..") continue;
      const path = dir === "/" ? "/" + entry : dir + "/" + entry;
      let stat;
      try { stat = FS.stat(path); } catch { continue; }
      if (FS.isDir(stat.mode)) walk(path);
      else found.push(path);
    }
  }
  walk(root);
  return found;
}
function outputExtension(mode) {
  return ({decomp:".gsc", comp:".gscbin", disasm:".gscasm", asm:".gscbin", parse:".gsc"})[mode];
}

languageSelect.addEventListener("change", () => setLanguage(languageSelect.value));
setLanguage("fr");

try {
  logEl.textContent = "";
  log(t("engineFiles"));
  GSC = await createGscTool({
    noInitialRun: true,
    locateFile: (path) => new URL(path, import.meta.url).href,
    print: log,
    printErr: (message) => log("[stderr] " + message)
  });

  if (!GSC.FS || typeof GSC.callMain !== "function") {
    throw new Error(t("missingExports"));
  }

  window.GSC = GSC;
  runBtn.disabled = false;
  setStatus("engineReady", true);
  log(t("engineReadyLog"));
} catch (error) {
  setStatus("engineFailed");
  log(error?.stack || error);
}

runBtn.addEventListener("click", async () => {
  if (!GSC) return;
  const file = fileInput.files?.[0];
  if (!file) { setStatus("chooseFile"); return; }

  runBtn.disabled = true;
  downloadEl.style.display = "none";
  logEl.textContent = "";

  const mode = document.getElementById("mode").value;
  const system = document.getElementById("system").value;
  const name = safeName(file.name);
  const ext = outputExtension(mode);
  const jobDir = "/job_" + (++jobNumber);

  try {
    const FS = GSC.FS;
    makeDir(FS, jobDir);
    FS.chdir(jobDir);

    const inputPath = jobDir + "/" + name;
    const bytes = new Uint8Array(await file.arrayBuffer());
    FS.writeFile(inputPath, bytes);

    log(t("imported") + name + " (" + bytes.length + " bytes)");
    log(t("command") + "gsc-tool -m " + mode + " -g iw8 -s " + system + " " + inputPath);
    setStatus("processing");

    const resultCode = GSC.callMain(["-m", mode, "-g", "iw8", "-s", system, inputPath]);
    log(t("returnCode") + resultCode);

    const candidates = walkFiles(FS, jobDir).filter(path =>
      path.toLowerCase().endsWith(ext) && path !== inputPath
    );

    if (!candidates.length) {
      log(t("noOutput"));
      walkFiles(FS, jobDir).forEach(path => log("  " + path));
      setStatus("finishedNoResult");
      return;
    }

    const outputPath = candidates[candidates.length - 1];
    const outputBytes = FS.readFile(outputPath);
    const outputName = outputPath.split("/").pop();
    const mime = (ext === ".gsc" || ext === ".gscasm") ? "text/plain;charset=utf-8" : "application/octet-stream";
    const url = URL.createObjectURL(new Blob([outputBytes], {type:mime}));

    downloadEl.href = url;
    downloadEl.download = outputName;
    downloadEl.textContent = t("download") + outputName;
    downloadEl.style.display = "block";

    log(t("result") + outputPath);
    log(t("size") + outputBytes.length + " bytes");
    setStatus("done", true);
  } catch (error) {
    log(t("error") + (error?.stack || error));
    setStatus("processingError");
  } finally {
    runBtn.disabled = false;
    FSRestoreDirectory();
  }

  function FSRestoreDirectory() {
    try { GSC.FS.chdir("/"); } catch {}
  }
});
</script>
</body>
</html>
