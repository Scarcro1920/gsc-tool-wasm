<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IW8 GSC Studio</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; padding:28px; background:#0d111b; color:#e8edf7; font:15px/1.5 system-ui,Arial,sans-serif; }
main { max-width:900px; margin:auto; }
.panel { background:#171e2c; border:1px solid #2b3548; border-radius:14px; padding:22px; margin:16px 0; }
h1 { margin:0 0 4px; font-size:28px; }
.muted { color:#9aa8bd; }
label { display:block; margin:13px 0 6px; font-weight:600; }
select,input[type=file],button { width:100%; padding:12px; border-radius:8px; border:1px solid #39465e; background:#101725; color:#e8edf7; }
button { cursor:pointer; background:#2868d7; border:0; font-weight:700; }
button:disabled { opacity:.5; cursor:wait; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
#status { padding:10px 12px; border-radius:8px; background:#101725; }
#log { min-height:150px; max-height:340px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; background:#080c13; border:1px solid #273247; padding:13px; border-radius:8px; color:#b8c8df; }
#download { display:none; margin-top:12px; text-align:center; text-decoration:none; background:#16794b; color:white; padding:12px; border-radius:8px; font-weight:700; }
@media(max-width:650px) { body{padding:14px} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<main>
<section class="panel">
<h1>IW8 GSC Studio</h1>
<div class="muted">GSC Tool · WebAssembly · Traitement local dans le navigateur</div>
<p id="status">Chargement du moteur WebAssembly...</p>
</section>

<section class="panel">
<div class="grid">
<div>
<label for="mode">Opération</label>
<select id="mode">
<option value="decomp">Décompiler (.gscbin → .gsc)</option>
<option value="comp">Compiler (.gsc → .gscbin)</option>
<option value="disasm">Désassembler (.gscbin → .gscasm)</option>
<option value="asm">Assembler (.gscasm → .gscbin)</option>
<option value="parse">Analyser (.gsc)</option>
</select>
</div>
<div>
<label for="system">Système IW8</label>
<select id="system">
<option value="pc">PC</option>
<option value="ps4">PlayStation 4</option>
<option value="ps5">PlayStation 5</option>
<option value="xb3">Xbox One</option>
<option value="xb4">Xbox Series X|S</option>
</select>
</div>
</div>
<label for="file">Fichier source</label>
<input id="file" type="file" accept=".gscbin,.gsc,.gscasm,.txt,*/*">
<p class="muted">Le fichier est traité localement dans le système de fichiers virtuel du moteur.</p>
<button id="run" disabled>Lancer le moteur</button>
<a id="download" download>Télécharger le résultat</a>
</section>

<section class="panel">
<strong>Console</strong>
<pre id="log">Initialisation...</pre>
</section>
</main>

<script type="module">
import createGscTool from "./gsc-tool.js";

const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const runBtn = document.getElementById("run");
const fileInput = document.getElementById("file");
const downloadEl = document.getElementById("download");

let GSC = null;
let jobNumber = 0;

function log(message) {
  logEl.textContent += String(message) + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}
function setStatus(message, good = false) {
  statusEl.textContent = message;
  statusEl.style.color = good ? "#67e5a2" : "#ffca75";
}
function safeName(name) {
  return name.replace(/[^a-zA-Z0-9._-]/g, "_").replace(/^\.+/, "") || "input";
}
function makeDir(FS, path) {
  try { FS.mkdir(path); }
  catch (e) { if (!FS.analyzePath(path).exists) throw e; }
}
function walkFiles(FS, root) {
  const found = [];
  function walk(dir) {
    let entries;
    try { entries = FS.readdir(dir); } catch { return; }
    for (const entry of entries) {
      if (entry === "." || entry === "..") continue;
      const path = dir === "/" ? "/" + entry : dir + "/" + entry;
      let stat;
      try { stat = FS.stat(path); } catch { continue; }
      if (FS.isDir(stat.mode)) walk(path);
      else found.push(path);
    }
  }
  walk(root);
  return found;
}
function outputExtension(mode) {
  return ({decomp:".gsc", comp:".gscbin", disasm:".gscasm", asm:".gscbin", parse:".gsc"})[mode];
}

try {
  logEl.textContent = "";
  log("Chargement de gsc-tool.js et gsc-tool.wasm...");
  GSC = await createGscTool({
    noInitialRun: true,
    locateFile: (path) => new URL(path, import.meta.url).href,
    print: log,
    printErr: (message) => log("[stderr] " + message)
  });

  if (!GSC.FS || typeof GSC.callMain !== "function") {
    throw new Error("Le moteur ne fournit pas FS ou callMain. Vérifie les exports Emscripten.");
  }

  window.GSC = GSC;
  runBtn.disabled = false;
  setStatus("Moteur chargé. Choisis un fichier et une opération.", true);
  log("Moteur prêt. FS et callMain sont accessibles.");
} catch (error) {
  setStatus("Échec du chargement du moteur.");
  log(error?.stack || error);
}

runBtn.addEventListener("click", async () => {
  if (!GSC) return;
  const file = fileInput.files?.[0];
  if (!file) { setStatus("Choisis d'abord un fichier."); return; }

  runBtn.disabled = true;
  downloadEl.style.display = "none";
  logEl.textContent = "";

  const mode = document.getElementById("mode").value;
  const system = document.getElementById("system").value;
  const name = safeName(file.name);
  const ext = outputExtension(mode);
  const jobDir = "/job_" + (++jobNumber);

  try {
    const FS = GSC.FS;
    makeDir(FS, jobDir);
    FS.chdir(jobDir);

    const inputPath = jobDir + "/" + name;
    const bytes = new Uint8Array(await file.arrayBuffer());
    FS.writeFile(inputPath, bytes);

    log("Fichier importé : " + name + " (" + bytes.length + " octets)");
    log("Commande : gsc-tool -m " + mode + " -g iw8 -s " + system + " " + inputPath);
    setStatus("Traitement en cours...");

    const resultCode = GSC.callMain(["-m", mode, "-g", "iw8", "-s", system, inputPath]);
    log("Code de retour : " + resultCode);

    const candidates = walkFiles(FS, jobDir).filter(path =>
      path.toLowerCase().endsWith(ext) && path !== inputPath
    );

    if (!candidates.length) {
      log("Aucun fichier de sortie détecté. Fichiers trouvés :");
      walkFiles(FS, jobDir).forEach(path => log("  " + path));
      setStatus("Commande terminée, mais aucun résultat détecté.");
      return;
    }

    const outputPath = candidates[candidates.length - 1];
    const outputBytes = FS.readFile(outputPath);
    const outputName = outputPath.split("/").pop();
    const mime = (ext === ".gsc" || ext === ".gscasm") ? "text/plain;charset=utf-8" : "application/octet-stream";
    const url = URL.createObjectURL(new Blob([outputBytes], {type:mime}));

    downloadEl.href = url;
    downloadEl.download = outputName;
    downloadEl.textContent = "Télécharger " + outputName;
    downloadEl.style.display = "block";

    log("Résultat : " + outputPath);
    log("Taille : " + outputBytes.length + " octets");
    setStatus("Opération terminée. Ton fichier est prêt.", true);
  } catch (error) {
    log("[ERREUR] " + (error?.stack || error));
    setStatus("Erreur pendant le traitement.");
  } finally {
    runBtn.disabled = false;
  }
});
</script>
</body>
</html>
