
name: Build GSC Tool WASM

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GSC Tool
        uses: actions/checkout@v4
        with:
          repository: xensik/gsc-tool
          submodules: recursive
          fetch-depth: 0

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15

      - name: Install Premake 5
        run: |
          curl -L \
            https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz \
            -o premake.tar.gz

          tar -xzf premake.tar.gz

          chmod +x premake5
          sudo mv premake5 /usr/local/bin/premake5

          premake5 --version

      - name: Check tools
        run: |
          em++ --version
          cmake --version
          make --version
          premake5 --version

      - name: Generate GSC Tool build files
        run: |
          git submodule update --init --recursive
          premake5 gmake2

      - name: Inspect generated projects
        run: |
          echo "Generated build files:"
          find build -maxdepth 4 -type f | head -100

          echo "Available projects:"
          find build -name "*.make" -o -name "Makefile"

      - name: Save build configuration
        run: |
          mkdir -p output

          tar -czf output/gsc-build-files.tar.gz build

          em++ --version > output/emscripten-version.txt
          git rev-parse HEAD > output/source-commit.txt

          echo "Premake generation successful" > output/status.txt

      - name: Upload build configuration
        uses: actions/upload-artifact@v4
        with:
          name: gsc-tool-generated-build
          path: output/
