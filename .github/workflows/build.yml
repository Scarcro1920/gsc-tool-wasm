
name: Build GSC Tool WASM64

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download GSC Tool
        uses: actions/checkout@v4
        with:
          repository: xensik/gsc-tool
          submodules: recursive
          fetch-depth: 0

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make curl tar

      - name: Install Premake
        run: |
          curl -L \
            https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-linux.tar.gz \
            -o premake.tar.gz

          tar -xzf premake.tar.gz
          chmod +x premake5
          sudo mv premake5 /usr/local/bin/premake5

      - name: Generate build files
        run: |
          git submodule update --init --recursive
          premake5 gmake2

      - name: Compile GSC Tool
        run: |
          make -C build \
            config=release_amd64 \
            -j2 \
            CC=emcc \
            CXX=em++ \
            AR=emar \
            RANLIB=emranlib \
            LDFLAGS="-sMODULARIZE=1 -sEXPORT_ES6=1 -sENVIRONMENT=web -sALLOW_MEMORY_GROWTH=1 -sFORCE_FILESYSTEM=1 -sEXPORTED_RUNTIME_METHODS=FS,callMain"

      - name: Prepare Chrome files
        run: |
          mkdir -p dist

          cp build/bin/amd64/release/gsc-tool dist/gsc-tool.js
          cp build/bin/amd64/release/gsc-tool.wasm dist/gsc-tool.wasm

          ls -lh dist/

          test -s dist/gsc-tool.js
          test -s dist/gsc-tool.wasm

      - name: Upload Chrome engine
        uses: actions/upload-artifact@v4
        with:
          name: gsc-tool-chrome-wasm64
          path: dist/
