
name: Build GSC Tool WASM

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Prepare IW8 WebAssembly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GSC Tool source
        uses: actions/checkout@v4
        with:
          repository: xensik/gsc-tool
          submodules: recursive
          fetch-depth: 0

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15

      - name: Check compiler
        run: |
          echo "Checking Emscripten..."
          em++ --version
          echo "Checking CMake..."
          cmake --version
          echo "Checking Ninja..."
          ninja --version
          echo "Checking emcmake..."
          command -v emcmake
          emcmake cmake --version

      - name: Inspect GSC Tool source
        run: |
          echo "Project files:"
          ls -la

          echo "Build configuration files:"
          find . -maxdepth 4 \
            \( -name "CMakeLists.txt" \
            -o -name "premake5.lua" \
            -o -name "Makefile" \) \
            -print

          echo "C++ source files:"
          find src -type f -name "*.cpp" | head -50

      - name: Prepare build information
        run: |
          mkdir -p output

          cp README.md output/README.md
          em++ --version > output/compiler.txt
          git rev-parse HEAD > output/source-commit.txt

          echo "IW8" > output/target-game.txt
          echo "Environment check successful" > output/status.txt

      - name: Upload build information
        uses: actions/upload-artifact@v4
        with:
          name: gsc-tool-wasm-build-info
          path: output/
          if-no-files-found: error
