
name: Compile GSC Tool for Chrome

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download GSC Tool
        uses: actions/checkout@v4
        with:
          repository: xensik/gsc-tool
          submodules: recursive
          fetch-depth: 0

      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v15

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make curl tar

      - name: Install Premake
        run: |
          curl -L \
            https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-linux.tar.gz \
            -o premake.tar.gz

          tar -xzf premake.tar.gz
          chmod +x premake5
          sudo mv premake5 /usr/local/bin/premake5

      - name: Generate build files
        run: |
          git submodule update --init --recursive
          premake5 gmake2

      - name: Compile with Emscripten
        id: compile
        continue-on-error: true
        run: |
          mkdir -p output

          set -o pipefail

          make -C build \
            config=release_amd64 \
            -j2 \
            CC=emcc \
            CXX=em++ \
            AR=emar \
            RANLIB=emranlib \
            LDFLAGS="-sWASM=1 -sMODULARIZE=1 -sEXPORT_ES6=1 -sENVIRONMENT=web -sALLOW_MEMORY_GROWTH=1 -sFORCE_FILESYSTEM=1" \
            2>&1 | tee output/compile.log

      - name: Collect generated files
        if: always()
        run: |
          mkdir -p output/files

          find build -type f \
            \( -name "*.wasm" -o -name "*.js" -o -name "gsc-tool" \) \
            -exec cp --parents {} output/files/ \; || true

          echo "Compilation finished." > output/status.txt

          em++ --version > output/compiler.txt

      - name: Upload compilation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-tool-wasm-attempt
          path: output/
